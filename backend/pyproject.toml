[project]
name = "travelai-backend"
version = "0.1.0"
description = "Zero-data travel assistant: SMS -> RAG/AI -> GSM-7 compliant SMS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "anthropic>=0.40",
    "unidecode>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.vercel]
entrypoint = "src.api.main:app"